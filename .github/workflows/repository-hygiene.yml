name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify repository contents and documentation links
        run: python3 scripts/check_repository.py --staged
      - name: Exercise repository hygiene checks
        run: python3 -m unittest discover -s tests -p test_repository_hygiene.py -v
